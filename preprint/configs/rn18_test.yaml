data:
  device: cuda:0
  in_memory: 1
  num_workers: 12
dist:
  world_size: 1
lr:
  lr: 0.5
  lr_peak_epoch: 2
  lr_schedule_type: cyclic
model:
  architecture: resnet18
  pretrained: 0
resolution:
  resolution_schedule_type: ramp
  end_ramp: 2
  max_res: 64
  min_res: 32
  start_ramp: 1
training:
  batch_size: 1024
  distributed: 0
  epochs: 2
  label_smoothing: 0.1
  momentum: 0.9
  optimizer: sgd
  weight_decay: 5e-5
  use_blurpool: 1
validation:
  lr_tta: true
  resolution: 256
  batch_size: 1024
